<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage books · Library QR Finder</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/premium.css"></head><body><div class="admin-layout"><aside class="sidebar"><a class="brand" href="/">▤ Library Admin</a><a href="/admin/dashboard.html">Dashboard</a><a class="active" href="/admin/books.html">Manage books</a><a href="/admin/requests.html">Book requests</a><a href="/admin/announcements.html">Announcements</a><button id="logout" class="sidebar-logout">↪ Sign out</button></aside><main class="admin-main"><div class="admin-top"><div><span class="eyebrow">CATALOGUE</span><h1>Manage books</h1></div><button class="btn primary" id="new-book">+ Add book</button></div><div id="book-form-panel" class="panel hidden"><h2 id="book-form-title">Add a book</h2><form id="book-form" class="form-grid"><input type="hidden" id="book-id"><label>Book title<input id="title" required maxlength="200"></label><label>Author<input id="author" required maxlength="150"></label><label>ISBN<input id="isbn" maxlength="30"></label><label>Category<input id="category" maxlength="80"></label><label>Total copies<input id="total-copies" type="number" min="0" value="1" required></label><label>Available copies<input id="available-copies" type="number" min="0" value="1" required></label><label>Floor<input id="floor" required></label><label>Section<input id="section" required placeholder="e.g. Programming"></label><label>Book store (shows on map)<input id="shelf" required></label><label>Row<input id="row-label" placeholder="e.g. B"></label><label>Position<input id="position-label" placeholder="e.g. 03"></label><label class="full">Description<textarea id="description" rows="2"></textarea></label><label class="full">Cover image URL (optional)<input id="cover-url" type="url"></label><div class="form-actions full"><button class="btn primary" type="submit">Save book</button><button class="btn secondary" type="button" id="cancel-edit">Cancel</button><span id="book-message" class="form-message"></span></div></form></div><section class="panel"><div class="search-row"><input id="book-search" placeholder="Search books…"></div><div class="table-wrap"><table><thead><tr><th>Book</th><th>Location</th><th>Copies</th><th>Actions</th></tr></thead><tbody id="books-table"></tbody></table></div></section><div id="qr-modal" class="modal hidden"><div class="modal-card"><button class="modal-close" id="close-qr">×</button><h2>Book QR code</h2><p id="qr-book-title" class="muted"></p><div id="qr-output"></div><button class="btn primary full" id="download-qr">Download QR PNG</button></div></div></main></div><script type="module" src="/js/admin-books.js"></script></body></html>
